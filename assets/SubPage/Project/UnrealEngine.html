<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="../../../">
    <title>UnrealEngine 项目工程</title>
    <link rel="icon" href="assets/Image/Icon/avatar.png" sizes="32x32"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            color: #e3e3e3;
            font-family: 'Poppins', sans-serif;
            line-height: 1.5;
        }

        .main-content {
            width: calc(100% - 48px);
            max-width: 1600px;
            margin: 0 auto;
            padding: 12px 0 40px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
        }

        .card-link {
            position: relative;
            display: block;
            color: inherit;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .card-link:hover,
        .card-link:focus-visible {
            border-color: rgba(49, 227, 228, 0.55);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.32);
            outline: none;
            transform: translateY(-4px);
        }

        .card-link .image-container {
            aspect-ratio: 16 / 9;
        }

        .card-link .image-container img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-link::after {
            position: absolute;
            right: 14px;
            bottom: 14px;
            padding: 5px 11px;
            border: 1px solid rgba(49, 227, 228, 0.38);
            border-radius: 999px;
            content: "点击查看 ↗";
            color: #7de8eb;
            background: rgba(7, 19, 35, 0.78);
            font-size: 11px;
            line-height: 1.2;
            transition: color 0.25s, background 0.25s;
        }

        .card-link:hover::after,
        .card-link:focus-visible::after {
            color: #071323;
            background: #31e3e4;
        }

        .empty-note {
            padding: 40px 20px;
            border: 1px dashed rgba(128, 157, 199, 0.28);
            border-radius: 10px;
            color: #9baec8;
            font-size: 13px;
            text-align: center;
        }

        @media (max-width: 1200px) {
            .card-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 900px) {
            .main-content {
                width: calc(100% - 28px);
            }
        }

        @media (max-width: 768px) {
            .card-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .main-content {
                padding-bottom: 32px;
            }
        }

        @media (max-width: 480px) {
            .card-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .main-content {
                width: calc(100% - 20px);
                padding-bottom: 24px;
            }
        }
    </style>
    <link rel="stylesheet" href="assets/css/portfolio-subpages.css">
</head>

<body>

<nav class="top-nav">
    <div class="nav-brand">
        <span class="nav-mark" aria-hidden="true"></span>
        <div class="nav-brand-copy">
            <strong>项目工程</strong>
            <span class="nav-divider" aria-hidden="true"></span>
            <span>UnrealEngine 工程分析归档</span>
        </div>
    </div>
</nav>

<div class="main-content">
    <div class="card-grid">
        <a class="card card-link" href="https://my.feishu.cn/wiki/H3fPwcFoiiBV4Hkle6XcZJNDnLh?fromScene=spaceOverview" target="_blank" rel="noopener noreferrer" aria-label="起风了_01：打开飞书文档">
            <div class="image-container">
                <img src="assets/Image/Project/UnrealEngine/起风了_01.png" alt="起风了_01">
            </div>
        </a>
    </div>
</div>

</body>
</html>
