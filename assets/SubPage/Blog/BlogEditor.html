<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="../../../">
    <title>分类链接管理</title>
    <link rel="icon" href="assets/Image/Icon/avatar.png" sizes="32x32"/>
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v3.0.6/css/line.css"/>
    <link href="assets/css/SubPageStyle.css" rel="stylesheet" type="text/css"/>
    <link href="assets/css/BlogEditor.css" rel="stylesheet" type="text/css"/>
</head>

<body>
<header class="editor-topbar">
    <nav class="editor-site-nav" aria-label="链接管理导航">
        <a href="assets/SubPage/Blog/TechBlog.html" class="editor-nav-link">
            <i class="uil uil-arrow-left"></i> 返回分类
        </a>
        <span class="editor-nav-context">分类链接管理</span>
    </nav>
</header>
<main class="editor-container">
    <section class="editor-meta">
        <h1><i class="uil uil-link"></i> 管理 6 个分类的外部链接</h1>
        <p class="link-editor-hint">填写 HTTP 或 HTTPS 地址。保存后下载 blog.json，并用它替换 assets/data/blog.json。</p>
        <form id="categoryLinksForm"></form>
        <p id="linkEditorStatus" role="status" aria-live="polite"></p>
        <div class="editor-actions">
            <button class="editor-btn editor-btn-primary" id="btnSaveLinks" type="button">
                <i class="uil uil-download-alt"></i> 下载分类链接配置
            </button>
        </div>
    </section>
</main>
<script src="assets/js/BlogEditor.js"></script>
</body>
</html>
