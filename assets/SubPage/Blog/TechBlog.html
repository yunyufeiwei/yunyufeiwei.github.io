<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="../../../">
    <title>技术博客</title>
    <link rel="icon" href="assets/Image/Icon/avatar.png" sizes="32x32"/>
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v3.0.6/css/line.css"/>
    <link href="assets/css/SubPageStyle.css" rel="stylesheet" type="text/css"/>
    <link href="assets/css/TechBlog.css" rel="stylesheet" type="text/css"/>
</head>

<body>
<div class="container" id="mainContainer">
        <main class="main-content">
            <!--==================== 文章列表视图 ====================-->
            <section id="blogListView">
                <header class="blog-topbar">
                    <nav class="blog-site-nav" aria-label="主导航">
                        <a class="blog-brand" href="index.html">
                            <span class="blog-brand-mark" aria-hidden="true"></span>
                            <span class="blog-brand-copy">
                                <strong>技术博客</strong>
                                <span class="blog-brand-subtitle">按分类浏览外部笔记</span>
                            </span>
                        </a>
                        <div class="blog-toolbar">
                            <div class="blog-site-links">
                                <a class="blog-home-link" href="index.html">返回主页</a>
                                <a class="blog-home-link" href="assets/SubPage/Blog/BlogEditor.html">管理分类链接</a>
                            </div>
                        </div>
                    </nav>
                </header>

                <div class="blog-list" id="blogList">
                    <!-- 六个分类外链由 TechBlog.js 动态渲染 -->
                </div>

                <div class="blog-empty" id="blogEmpty" style="display:none;">
                    <i class="uil uil-file-search-alt"></i>
                    <p>分类加载失败，请稍后重试。</p>
                </div>

                <div class="blog-back"><a href="index.html" class="blog-back-link"><i class="uil uil-arrow-left"></i> 返回主页</a></div>
            </section>
        </main>
</div>
<script src="assets/js/TechBlog.js"></script>
</body>
</html>
