<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="../../../">
    <title>技术博客</title>
    <link rel="icon" href="assets/Image/Icon/avatar.png" sizes="32x32"/>
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v3.0.6/css/line.css"/>
    <link href="assets/css/SubPageStyle.css" rel="stylesheet" type="text/css"/>
    <link href="assets/css/TechBlog.css" rel="stylesheet" type="text/css"/>
    <!-- highlight.js 主题（与编辑器保持一致） -->
    <link href="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/styles/atom-one-dark.min.css" rel="stylesheet"/>
</head>

<body>
<div class="container" id="mainContainer">
        <main class="main-content">
            <!--==================== 文章列表视图 ====================-->
            <section id="blogListView">
                <header class="blog-topbar">
                    <nav class="blog-site-nav" aria-label="主导航">
                        <a class="blog-brand" href="index.html">
                            <span class="blog-brand-mark" aria-hidden="true"></span>
                            <span class="blog-brand-copy">
                                <strong>技术博客</strong>
                                <span class="blog-brand-subtitle">记录学习与思考 · 分享技术与经验</span>
                            </span>
                        </a>
                        <div class="blog-toolbar">
                            <div class="blog-search">
                                <i class="uil uil-search"></i>
                                <input type="search" id="blogSearchInput" placeholder="搜索文章、标签、技术关键词..." aria-label="搜索博客文章">
                                <button class="blog-search-submit" type="button" aria-label="搜索">搜索</button>
                            </div>
                            <div class="blog-filter">
                                <button class="blog-filter-toggle" id="blogFilterToggle" type="button" aria-expanded="false" aria-controls="blogFilterMenu">
                                    <i class="uil uil-filter"></i><span>筛选</span><span class="blog-filter-count" id="blogFilterCount" hidden></span>
                                </button>
                                <div class="blog-filter-menu" id="blogFilterMenu">
                                    <div class="blog-filter-menu-heading">
                                        <div><strong>筛选文章</strong><span>可在不同标签组间组合筛选</span></div>
                                        <button id="blogFilterClear" type="button">重置</button>
                                    </div>
                                    <section class="blog-filter-group">
                                        <h2>软件</h2>
                                        <div class="blog-filter-options" data-facet-group="software"></div>
                                    </section>
                                    <section class="blog-filter-group">
                                        <h2>模块</h2>
                                        <div class="blog-filter-options" data-facet-group="module"></div>
                                    </section>
                                    <section class="blog-filter-group">
                                        <h2>类型</h2>
                                        <div class="blog-filter-options" data-facet-group="type"></div>
                                    </section>
                                </div>
                            </div>
                            <div class="blog-site-links">
                                <a class="blog-home-link" href="index.html">返回主页</a>
                                <a class="blog-write-link" href="assets/SubPage/Blog/BlogEditor.html">写新文章</a>
                            </div>
                        </div>
                    </nav>
                </header>

                <nav class="blog-category-nav" id="blogCategoryNav" hidden></nav>

                <div class="blog-list" id="blogList">
                    <!-- 卡片由 TechBlog.js 动态渲染 -->
                </div>

                <div class="blog-empty" id="blogEmpty" style="display:none;">
                    <i class="uil uil-file-search-alt"></i>
                    <p>没有匹配的文章，换个关键词或分类试试吧。</p>
                </div>

                <div class="blog-back"><a href="index.html" class="blog-back-link"><i class="uil uil-arrow-left"></i> 返回主页</a></div>
            </section>

            <!--==================== 文章详情视图 ====================-->
            <section id="blogDetailView" style="display:none;">
                <nav class="blog-detail-nav" aria-label="文章操作">
                    <a href="#" id="blogDetailBack" class="blog-back-link">
                        <i class="uil uil-arrow-left"></i> 返回文章列表
                    </a>
                    <a href="#" id="blogDetailEdit" class="blog-back-link blog-detail-edit">
                        <i class="uil uil-edit"></i> 编辑此文
                    </a>
                </nav>

                <article class="blog-detail">
                    <header class="blog-detail-header">
                        <div class="blog-card-meta">
                            <span class="blog-card-tag" id="detailCategory"></span>
                            <span class="blog-card-date">
                                <i class="uil uil-calendar-alt"></i>
                                <span id="detailDate"></span>
                            </span>
                        </div>
                        <h1 class="blog-detail-title" id="detailTitle"></h1>
                        <p class="blog-detail-summary" id="detailSummary"></p>
                        <div class="blog-detail-tags" id="detailTags"></div>
                    </header>

                    <div class="blog-detail-content" id="detailContent">
                        <!-- 文章正文由 TechBlog.js 动态渲染 -->
                    </div>
                </article>
            </section>
        </main>
</div>

<!-- Markdown 渲染器 -->
<script src="https://cdn.jsdelivr.net/npm/marked@14.1.3/marked.min.js"></script>
<!-- 代码高亮 -->
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/languages/cpp.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/languages/csharp.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/languages/hlsl.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/languages/glsl.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/languages/javascript.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/languages/python.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/languages/json.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/languages/xml.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/languages/css.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/languages/bash.min.js"></script>
<script src="assets/js/TechBlog.js"></script>
</body>
</html>
