<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="../../../">
    <title>关卡地图作品集</title>
    <link rel="icon" href="assets/Image/Icon/avatar.png" sizes="32x32"/>
    <style>
        :root {
            --hue-color: 250;
            --bg-color: hsl(var(--hue-color), 28%, 12%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            position: relative;
            isolation: isolate;
            min-height: 100vh;
            background:
                radial-gradient(ellipse at 18% 20%, rgba(20, 148, 171, 0.16), transparent 42%),
                radial-gradient(ellipse at 88% 76%, rgba(100, 42, 181, 0.24), transparent 45%),
                linear-gradient(115deg, #071323, #0a172c 55%, #10152e);
            background-attachment: fixed;
            color: #e3e3e3;
            font-family: 'Poppins', sans-serif;
            line-height: 1.5;
        }

        body::before {
            position: fixed;
            z-index: -1;
            inset: 0;
            content: "";
            opacity: 0.45;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(86, 129, 188, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(86, 129, 188, 0.08) 1px, transparent 1px);
            background-size: 72px 72px;
        }

        /* 顶部标题栏 - sticky */
        .top-nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            backdrop-filter: blur(14px);
            background: rgba(7, 19, 35, 0.88);
        }

        .page-title {
            font-size: 1.5rem;
            color: hsl(var(--hue-color), 69%, 61%);
        }

        /* 主内容区域 */
        .main-content {
            width: calc(100% - 48px);
            max-width: 1600px;
            margin: 0 auto;
            padding: 12px 0 24px;
        }

        /* 卡片网格 - 默认4列 */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        /* 卡片样式 */
        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: zoom-in;
            will-change: transform;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .card .image-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: none;
        }

        .card .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 视频卡片缩略图 */
        .video-thumb-container {
            position: relative;
        }

        .video-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }

        .video-play-icon {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: rgba(255, 255, 255, 0.9);
            background: rgba(0, 0, 0, 0.35);
            transition: background 0.2s;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
        }

        .video-card:hover .video-play-icon {
            background: rgba(0, 0, 0, 0.5);
        }

        .card:hover .image-container img {
        }

        .card .card-title {
            display: none;
        }

        /* 放大图片的容器 */
        .enlarged-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .enlarged-container.active {
            opacity: 1;
            visibility: visible;
        }

        .enlarged-image {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            cursor: zoom-out;
        }

        .enlarged-video {
            cursor: default;
            background: #000;
        }

        .enlarged-container.active .enlarged-image {
        }

        /* 响应式：3列 */
        @media (max-width: 1200px) {
            .card-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* 响应式：2列 */
        @media (max-width: 768px) {
            .card-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .top-nav {
                padding: 10px 16px;
            }

            .page-title {
                font-size: 1.3rem;
            }

            .main-content {
                padding: 0 0 32px;
            }
        }

        @media (min-width: 1500px) {
            .main-content {
                width: calc(100% - 80px);
            }
        }

        @media (max-width: 900px) {
            .main-content {
                width: calc(100% - 28px);
            }
        }

        @media (max-width: 640px) {
            .main-content {
                width: calc(100% - 20px);
            }
        }

        /* 响应式：1列 */
        @media (max-width: 480px) {
            .card-grid {
                grid-template-columns: 1fr;
            }

            .top-nav {
                padding: 8px 12px;
            }

            .page-title {
                font-size: 1.1rem;
            }

            .main-content {
                padding: 0 0 24px;
            }
        }
    </style>
    <link rel="stylesheet" href="assets/css/portfolio-subpages.css">
</head>

<!-- 放大图片的容器 -->
<div id="enlargedContainer" class="enlarged-container">
    <img id="enlargedImage" class="enlarged-image" src="" alt="放大图片">
    <video id="enlargedVideo" class="enlarged-image enlarged-video" src="" controls autoplay loop style="display:none;"></video>
</div>

<script>
(function() {
    const enlargedContainer = document.getElementById('enlargedContainer');
    const enlargedImage = document.getElementById('enlargedImage');
    const enlargedVideo = document.getElementById('enlargedVideo');
    function closeEnlarged() {
        enlargedContainer.classList.remove('active');
        enlargedImage.src = '';
        enlargedImage.style.display = '';
        enlargedVideo.pause();
        enlargedVideo.src = '';
        enlargedVideo.style.display = 'none';
        document.body.style.overflow = '';
    }

    document.addEventListener('click', function(event) {
        const card = event.target.closest('.card');
        if (!card) return;

        if (card.classList.contains('video-card')) {
            const videoSrc = card.dataset.videoSrc;
            enlargedImage.style.display = 'none';
            enlargedVideo.style.display = '';
            enlargedVideo.src = videoSrc;
            enlargedVideo.play();
            enlargedContainer.classList.add('active');
            document.body.style.overflow = 'hidden';
            return;
        }

        const img = card.querySelector('img');
        if (img) {
            enlargedVideo.style.display = 'none';
            enlargedImage.src = img.src;
            enlargedImage.alt = img.alt;
            enlargedContainer.classList.add('active');
            document.body.style.overflow = 'hidden';
        }
    });

    enlargedContainer.addEventListener('click', function(event) {
        if (event.target === enlargedContainer) closeEnlarged();
    });

    enlargedImage.addEventListener('click', closeEnlarged);

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && enlargedContainer.classList.contains('active')) {
            closeEnlarged();
        }
    });
})();
</script>
